<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Withdraw Funds - Coinluxora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050a18;
  --stroke:rgba(255,255,255,.12);
  --text:#eaf0ff;
  --muted:rgba(234,240,255,.65);
  --ok:#34d399;
  --err:#f87171;
  --warn:#facc15;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  padding:16px;
}
.container{max-width:980px;margin:0 auto}

/* Premium Card */
.card{
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  box-shadow:0 20px 80px rgba(0,0,0,.55);
}

/* Inputs */
input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);
  color:white;
}
button{
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(90deg,#5b6cff,#34d399);
  color:white;
}

.badge{
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
}
.pending{background:#facc15;color:#000}
.approved{background:#22c55e;color:#000}
.rejected{background:#f87171;color:#000}

table{
  width:100%;
  margin-top:12px;
  border-collapse:collapse;
}
th,td{
  border:1px solid #1e293b;
  padding:10px;
  font-size:13px;
}
th{background:#0b1224}

.ok{color:var(--ok)}
.err{color:var(--err)}
.warn{color:var(--warn)}
</style>
</head>

<body>
<div class="container">

<h2>Withdraw Funds</h2>

<div class="card">
  <label>Withdrawal Type</label>
  <select id="withdrawType" onchange="toggleType()">
    <option value="crypto">Crypto Withdrawal</option>
    <option value="bank">Bank Withdrawal</option>
  </select>

  <!-- CRYPTO -->
  <div id="cryptoBox">
    <input id="asset" placeholder="Asset (BTC, USDT, ETH)">
    <input id="network" placeholder="Network (TRC20, ERC20)">
    <input id="wallet" placeholder="Wallet Address">
  </div>

  <!-- BANK -->
  <div id="bankBox" style="display:none">
    <input id="bankName" placeholder="Bank Name">
    <input id="accountName" placeholder="Account Name">
    <input id="accountNumber" placeholder="Account Number">
    <input id="swift" placeholder="SWIFT / Routing Code (Optional)">
    <input id="country" placeholder="Country">
  </div>

  <input id="amount" placeholder="Withdrawal Amount">

  <button onclick="submitWithdrawal()">Submit Withdrawal</button>
  <div id="msg"></div>
</div>

<div class="card">
<h3>Withdrawal History</h3>
<div id="historyMsg">Loading…</div>
<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Details</th>
<th>Amount</th>
<th>Status</th>
<th>Admin Note</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

</div>

<script>
const SUPABASE_URL="https://xdcscknfomlzwysczegc.supabase.co";
const SUPABASE_ANON_KEY="YOUR_ANON_KEY";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentEmail="";

function toggleType(){
  const type=document.getElementById("withdrawType").value;
  document.getElementById("cryptoBox").style.display= type==="crypto" ? "block":"none";
  document.getElementById("bankBox").style.display= type==="bank" ? "block":"none";
}

function badge(s){
  return `<span class="badge ${s}">${s}</span>`;
}

async function submitWithdrawal(){
  const msg=document.getElementById("msg");
  msg.innerHTML="Submitting...";

  const type=document.getElementById("withdrawType").value;
  const amount=document.getElementById("amount").value;

  let data={
    user_email:currentEmail,
    type:type,
    amount:amount,
    status:"pending"
  };

  if(type==="crypto"){
    data.asset=document.getElementById("asset").value;
    data.network=document.getElementById("network").value;
    data.wallet_address=document.getElementById("wallet").value;

    if(!data.asset||!data.wallet_address){
      msg.innerHTML="<span class='err'>Fill all crypto fields</span>";
      return;
    }
  }

  if(type==="bank"){
    data.bank_name=document.getElementById("bankName").value;
    data.account_name=document.getElementById("accountName").value;
    data.account_number=document.getElementById("accountNumber").value;
    data.swift=document.getElementById("swift").value;
    data.country=document.getElementById("country").value;

    if(!data.bank_name||!data.account_number||!data.account_name){
      msg.innerHTML="<span class='err'>Fill all bank fields</span>";
      return;
    }
  }

  const { error } = await supabaseClient.from("withdrawals").insert([data]);

  if(error){
    msg.innerHTML="<span class='err'>"+error.message+"</span>";
    return;
  }

  msg.innerHTML="<span class='ok'>Withdrawal submitted ✅</span>";
  loadWithdrawals();
}

async function loadWithdrawals(){
  const { data:userData } = await supabaseClient.auth.getUser();
  if(!userData.user){
    document.body.innerHTML="<h2>Login required</h2>";
    return;
  }
  currentEmail=userData.user.email;

  const { data } = await supabaseClient
    .from("withdrawals")
    .select("*")
    .eq("user_email", currentEmail)
    .order("created_at",{ascending:false});

  const tbody=document.getElementById("rows");
  const historyMsg=document.getElementById("historyMsg");

  if(!data||data.length===0){
    historyMsg.innerHTML="<span class='warn'>No withdrawals yet</span>";
    return;
  }

  historyMsg.innerHTML="<span class='ok'>Showing history</span>";
  tbody.innerHTML="";

  data.forEach(w=>{
    let detail = w.type==="bank"
      ? w.bank_name+" - "+w.account_number
      : w.asset+" ("+w.network+")";

    tbody.innerHTML+=`
      <tr>
        <td>${new Date(w.created_at).toLocaleString()}</td>
        <td>${w.type}</td>
        <td>${detail}</td>
        <td>${w.amount}</td>
        <td>${badge(w.status)}</td>
        <td>${w.admin_note||"-"}</td>
      </tr>
    `;
  });
}

loadWithdrawals();
</script>
</body>
</html>

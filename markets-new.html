<style>
:root{
  --bg:#080c18; --s1:#0d1117; --s2:#111827; --s3:#1a2236; --s4:#222d42;
  --b:rgba(255,255,255,.07); --b2:rgba(255,255,255,.13);
  --accent:#f05a1a; --accent-dk:#d94d12;
  --green:#0ecb81; --red:#f6465d; --gold:#f0b90b; --blue:#2196f3;
  --text:#eaecef; --sub:#848e9c;
  --sidebar:220px; --header:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;border:none;outline:none;background:none;color:var(--text);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

.page{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* HEADER */
.hdr{height:var(--header);flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 20px 0 0;z-index:50;}
.hdr-logo-wrap{width:var(--sidebar);flex-shrink:0;height:100%;display:flex;align-items:center;padding:0 16px;border-right:1px solid var(--b);}
.hdr-logo-wrap img{height:34px;width:auto;}
.hdr-search{flex:1;max-width:340px;margin-left:16px;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:0 12px;height:36px;}
.hdr-search input{font-size:13px;flex:1;}
.hdr-search input::placeholder{color:var(--sub);}
.hdr-spacer{flex:1;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.live-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:4px 10px;background:var(--s2);border:1px solid var(--b);border-radius:6px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hicon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;transition:all .15s;position:relative;}
.hicon:hover{background:var(--s3);color:var(--text);}
.hicon-badge{position:absolute;top:3px;right:2px;background:var(--red);color:#fff;font-size:8px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--s1);}
.hdr-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c94400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--s1);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .25s ease;}
.sidebar::-webkit-scrollbar{width:0;}
.sb-nav{flex:1;padding:8px 0;}
.nav-group-label{font-size:10px;font-weight:600;letter-spacing:.8px;color:rgba(132,142,156,.5);text-transform:uppercase;padding:14px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .15s;white-space:nowrap;border-left:2.5px solid transparent;text-decoration:none;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);}
.nav-item.active{color:var(--accent);background:rgba(240,90,26,.07);border-left-color:var(--accent);}
.nav-item svg{flex-shrink:0;width:16px;height:16px;}
.nav-item-label{flex:1;}
.nav-item-badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(240,90,26,.18);color:var(--accent);flex-shrink:0;}
.nav-divider{height:1px;background:var(--b);margin:6px 0;}
.sb-bottom{flex-shrink:0;border-top:1px solid var(--b);}
.sb-user{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.sb-user:hover{background:rgba(255,255,255,.03);}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c94400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sb-user-info{flex:1;min-width:0;}
.sb-user-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user-email{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;}
.main::-webkit-scrollbar{width:4px;}

/* TICKER TAPE */
.ticker-wrap{border-bottom:1px solid var(--b);flex-shrink:0;overflow:hidden;}

/* MARKETS CONTENT */
.markets-content{padding:20px 24px 40px;flex:1;}

/* PAGE HEADER */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:20px;font-weight:800;color:var(--text);}

/* CATEGORY TABS */
.cat-tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:4px;width:fit-content;margin-bottom:16px;flex-wrap:wrap;}
.cat-tab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;border:none;background:none;white-space:nowrap;}
.cat-tab.active{background:var(--accent);color:#fff;}
.cat-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05);}
.cat-tab-icon{font-size:14px;}

/* FILTER ROW */
.filter-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.sub-tabs{display:flex;gap:3px;}
.sub-tab{padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;border:1.5px solid transparent;background:none;}
.sub-tab.active{color:var(--text);background:var(--s3);border-color:var(--b2);}
.sub-tab:hover:not(.active){color:var(--text);}
.filter-search{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:0 12px;height:34px;min-width:200px;}
.filter-search input{font-size:12.5px;flex:1;}
.filter-search input::placeholder{color:var(--sub);}
.filter-spacer{flex:1;}

/* WIDGET CONTAINER */
.widget-panel{display:none;}
.widget-panel.active{display:block;}
.tradingview-widget-container{border-radius:14px;overflow:hidden;border:1px solid var(--b);}
.tradingview-widget-container iframe{display:block;}

/* LIGHT THEME */
body.light{--bg:#f0f2f5;--s1:#fff;--s2:#f7f8fa;--s3:#eef0f3;--s4:#e4e7eb;--b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.14);--text:#111827;--sub:#6b7280;}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);}

@media(max-width:768px){
  .markets-content{padding:12px 12px 40px;}
  .cat-tabs{gap:2px;}
  .cat-tab{padding:7px 10px;font-size:12px;}
}
</style>

<script>
const db = window.SV_DB;
let uid = null;
let currentCategory = 'crypto';
let currentSubFilter = 'all';
let watchlist = JSON.parse(localStorage.getItem('vgm-watchlist')||'[]');

function setCategory(cat, el){
  currentCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.widget-panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('panel-'+cat);
  if(panel) panel.classList.add('active');
}

function setSubFilter(f, el){
  currentSubFilter = f;
  document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  // Watchlist sub-filter: highlight note
  if(f === 'watchlist'){
    showToast('Watchlist filter â€” add symbols to your watchlist by starring them in any widget.','success');
  }
}

function handleSearch(val){
  // The TradingView widget handles its own search internally.
  // For user feedback, show a hint if they type something.
  if(val.length > 1){
    // No-op: TradingView Market Overview has built-in search within each widget
  }
}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:'+(type==='success'?'#0ecb81':'#f6465d')+';color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:340px;line-height:1.4;';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000);
}

async function init(){
  const {data:{session}} = await db.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  uid = session.user.id;

  const {data:p} = await db.from('profiles').select('first_name,last_name').eq('id',uid).single();
  if(p){
    const initials = ((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'') || '?';
    document.getElementById('hdr-avatar').textContent = initials;
    document.getElementById('sb-avatar').textContent = initials;
    document.getElementById('sb-name').textContent = [p.first_name,p.last_name].filter(Boolean).join(' ') || 'User';
  }
  document.getElementById('sb-email').textContent = session.user.email || '';

  // Unread notifications badge
  const {count} = await db.from('notifications').select('*',{count:'exact',head:true}).eq('user_id',uid).eq('read',false);
  if(count > 0){
    const badge = document.getElementById('hdr-notif-badge');
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'flex';
  }

  // Apply saved theme
  if(localStorage.getItem('vgm-theme')==='light') document.body.classList.add('light');
}

async function signOut(){
  await db.auth.signOut();
  window.location.href='login.html';
}

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Support - Coinluxora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050a18;
  --border:rgba(255,255,255,.12);
  --text:#eaf0ff;
  --muted:rgba(234,240,255,.65);
  --ok:#34d399;
  --err:#f87171;
  --warn:#facc15;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 420px at 10% 0%, rgba(83,113,255,.22), transparent 55%),
    radial-gradient(900px 420px at 90% 0%, rgba(52,211,153,.18), transparent 55%),
    var(--bg);
  color:var(--text);
  padding:16px;
  padding-bottom:34px;
  overflow-x:hidden;
}
.container{max-width:980px;margin:0 auto}

/* =========================================
   TOP NAV
========================================= */
.topFloatNav{
  position:sticky;
  top:10px;
  z-index:500;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.backBtn,.menuBtn{
  padding:12px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  color:white;
  font-weight:1000;
  cursor:pointer;
}

/* =========================================
   SIDEBAR (MATCH DASHBOARD STYLE)
========================================= */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.65);
  display:none; z-index:999;
}
.overlay.show{display:block;}

.sidebar{
  position:fixed; top:0; left:-315px;
  width:292px; height:100vh;
  padding:16px;
  transition:.28s ease;
  border-right:1px solid rgba(255,255,255,.10);
  background:rgba(5,10,24,0.98);
  box-shadow:0 26px 90px rgba(0,0,0,.60);
  overflow-y:auto;
  z-index:1000;
}
.sidebar.open{left:0;}

.sideTop{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
}
.sideLogoWide{
  height:120px;
  width:auto;
  max-width:220px;
  object-fit:contain;
}
.closeBtn{
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;
  border-radius:14px;
  width:44px;height:44px;
  cursor:pointer;
  font-weight:1000;
}

.userTag{
  padding:12px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.06);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.userTag .name{
  font-weight:1000;
}
.sideAvatar{
  width:44px;height:44px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.25);
  display:grid;place-items:center;
  overflow:hidden;
}
.sideAvatar img{
  width:100%;height:100%;object-fit:cover;display:none;
}

.menuTitle{
  font-size:12px;
  font-weight:1000;
  color:rgba(234,240,255,.55);
  margin:10px 0;
}

.sideItem{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.22);
  margin-bottom:10px;
  text-decoration:none;
  color:#fff;
  font-weight:1000;
}
.sideItem:hover{background:rgba(255,255,255,.08)}
.activeLink{
  border:1px solid rgba(56,189,248,.55);
  background:rgba(56,189,248,.12);
}
.sideLogout{
  margin-top:10px;
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  font-weight:1000;
  cursor:pointer;
  background:linear-gradient(90deg,#f87171,#ef4444);
  color:white;
}

/* =========================================
   CONTENT
========================================= */
.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(255,255,255,.06);
  margin-bottom:14px;
}
.topBar .title{font-weight:1000}
.topBar .email{font-weight:900}

.section{
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  background:rgba(255,255,255,.05);
  margin-bottom:14px;
}
input,textarea{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.32);
  color:white;
  margin-top:12px;
}
textarea{min-height:120px}

.gradBtn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:1000;
  background:linear-gradient(90deg,#5b6cff,#34d399);
  color:white;
  cursor:pointer;
}

.ticket{
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:14px;
  margin-top:12px;
  background:rgba(0,0,0,.22);
}
.pill{
  padding:6px 12px;border-radius:999px;font-weight:1000;font-size:12px;
}
.open{background:rgba(250,204,21,.14);color:#facc15}
.closed{background:rgba(34,197,94,.16);color:#22c55e}
.ok{color:var(--ok);font-weight:1000}
.err{color:var(--err);font-weight:1000}
.warn{color:var(--warn);font-weight:1000}
</style>
</head>

<body>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
  <div class="sideTop">
    <img src="assets/vgm-logo.png" class="sideLogoWide">
    <button class="closeBtn" onclick="closeMenu()">✕</button>
  </div>

  <div class="userTag">
    <div>
      <div style="font-size:12px;opacity:.6;font-weight:900">Logged in as</div>
      <div id="sideName" class="name">---</div>
    </div>
    <div class="sideAvatar">
      <span id="avatarFallback">👤</span>
      <img id="avatarImg"/>
    </div>
  </div>

  <div class="menuTitle">Navigation</div>

  <a class="sideItem" href="user-dashboard.html">🏠 Dashboard</a>
  <a class="sideItem" href="portfolio.html">📊 Portfolio</a>
  <a class="sideItem" href="plans.html">💼 Investment Plans</a>
  <a class="sideItem" href="deposits.html">💳 Deposit</a>
  <a class="sideItem" href="withdraw.html">➡ Withdraw</a>
  <a class="sideItem activeLink" href="support.html">🧑‍💻 Support</a>
  <a class="sideItem" href="profile.html">👤 Profile</a>

  <button class="sideLogout" onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="topFloatNav">
    <button class="backBtn" onclick="goDashboard()">← Dashboard</button>
    <button class="menuBtn" onclick="openMenu()">☰</button>
  </div>

  <div class="topBar">
    <div class="title">Support Center</div>
    <div class="email" id="topName">Loading…</div>
  </div>

  <div class="section">
    <h2>Contact Support</h2>

    <input id="subject" placeholder="Subject">
    <textarea id="message" placeholder="Describe your issue"></textarea>
    <button class="gradBtn" onclick="submitTicket()">Submit Ticket</button>
    <div id="msg"></div>
  </div>

  <div class="section">
    <h2>My Tickets</h2>
    <div id="ticketList"></div>
  </div>

</div>

<script>
const SUPABASE_URL="https://xdcscknfomlzwysczegc.supabase.co";
const SUPABASE_ANON_KEY="YOUR_KEY";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentUserEmail="";

function openMenu(){document.getElementById("sidebar").classList.add("open");document.getElementById("overlay").classList.add("show");}
function closeMenu(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show");}
function goDashboard(){window.location.href="user-dashboard.html";}

function setAvatar(url){
  const img=document.getElementById("avatarImg");
  const fallback=document.getElementById("avatarFallback");
  if(url){
    img.src=url;
    img.style.display="block";
    fallback.style.display="none";
  }
}

async function init(){
  const {data}=await supabaseClient.auth.getUser();
  if(!data.user){document.body.innerHTML="<h2 style='color:white'>Login first</h2>";return;}
  currentUserEmail=data.user.email;

  const {data:profile}=await supabaseClient.from("users").select("full_name,avatar_url").eq("email",currentUserEmail).maybeSingle();
  const name=profile?.full_name || data.user.user_metadata?.full_name || "User";
  const avatar=profile?.avatar_url || data.user.user_metadata?.avatar_url || "";

  document.getElementById("topName").innerText=name;
  document.getElementById("sideName").innerText=name;
  setAvatar(avatar);

  loadTickets();
}

async function submitTicket(){
  const subject=document.getElementById("subject").value.trim();
  const message=document.getElementById("message").value.trim();
  if(subject.length<3||message.length<10){
    document.getElementById("msg").innerHTML="<span class='err'>Invalid input</span>";
    return;
  }
  await supabaseClient.from("support_tickets").insert([{user_email:currentUserEmail,subject,message,status:"open"}]);
  document.getElementById("msg").innerHTML="<span class='ok'>Ticket submitted ✅</span>";
  document.getElementById("subject").value="";
  document.getElementById("message").value="";
  loadTickets();
}

async function loadTickets(){
  const {data}=await supabaseClient.from("support_tickets").select("*").eq("user_email",currentUserEmail).order("created_at",{ascending:false});
  const list=document.getElementById("ticketList");
  list.innerHTML="";
  data?.forEach(t=>{
    list.innerHTML+=`
      <div class="ticket">
        <strong>${t.subject}</strong>
        <div style="margin-top:6px">${t.message}</div>
        <div style="margin-top:6px" class="pill ${t.status}">${t.status.toUpperCase()}</div>
      </div>
    `;
  });
}

async function logout(){await supabaseClient.auth.signOut();window.location.href="login.html";}
init();
</script>

</body>
</html>

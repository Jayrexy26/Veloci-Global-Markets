<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VGM Admin API | Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#050a18;
      --text:#eaf0ff;
      --muted: rgba(234,240,255,.65);
      --stroke: rgba(255,255,255,0.12);
      --panel: rgba(255,255,255,0.06);
      --ok:#22c55e;
      --err:#f87171;
      --warn:#fbbf24;
      --blue:#5b6cff;
      --purple:#7c4dff;
      --shadow: 0 26px 90px rgba(0,0,0,.55);
      --shadow2: 0 14px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 600px at 20% -10%, rgba(91,108,255,.18), transparent 60%),
        radial-gradient(900px 600px at 90% 0%, rgba(124,77,255,.14), transparent 55%),
        radial-gradient(900px 600px at 50% 110%, rgba(56,189,248,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      padding:18px;
    }
    .wrap{max-width: 980px; margin: 0 auto; display:grid; gap:14px}
    .card{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      box-shadow: var(--shadow2);
      padding:14px;
    }
    h1{margin:0 0 8px;font-size:20px}
    .sub{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .grid{display:grid;grid-template-columns: 1fr 1fr; gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    label{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.04em}
    input{
      width:100%;
      padding:12px 12px;
      border-radius: 14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    input:focus{border-color: rgba(91,108,255,.45); box-shadow: 0 0 0 4px rgba(91,108,255,.12)}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding:11px 12px;
      border-radius: 14px;
      font-weight:950;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18)}
    .btn.primary{
      background: linear-gradient(135deg, rgba(91,108,255,.22), rgba(124,77,255,.14));
      border-color: rgba(91,108,255,.25);
    }
    .btn.danger{border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.10)}
    .status{
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      overflow:auto;
      max-height: 320px;
      white-space: pre-wrap;
    }
    .ok{color:var(--ok);font-weight:950}
    .err{color:var(--err);font-weight:950}
    .warn{color:var(--warn);font-weight:950}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size:12px;
      font-weight:900;
    }
    .dot{width:8px;height:8px;border-radius:99px;background: rgba(34,197,94,.85); box-shadow: 0 0 0 4px rgba(34,197,94,.12)}
    code{color:#c7d2fe}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Admin API Test</h1>
      <p class="sub">
        This page confirms: <b>auth session</b> ✅, <b>email verified</b> ✅, and <b>admins table check</b> ✅.
      </p>
      <div style="margin-top:10px" class="pill"><span class="dot"></span> Edge Function: <code>/functions/v1/admin-api</code></div>
    </div>

    <div class="grid">
      <div class="card">
        <div style="font-weight:950;margin-bottom:8px">Sign In (if not already)</div>
        <div style="display:grid;gap:8px">
          <label>Email</label>
          <input id="email" type="email" placeholder="admin@email.com" autocomplete="email">
          <label>Password</label>
          <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="btnRow">
          <button class="btn primary" onclick="login()">Sign in</button>
          <button class="btn" onclick="check()">Check Session</button>
          <button class="btn danger" onclick="logout()">Logout</button>
        </div>
        <div style="margin-top:10px" class="status" id="authBox">Loading…</div>
      </div>

      <div class="card">
        <div style="font-weight:950;margin-bottom:8px">Admin API Calls</div>
        <div class="btnRow">
          <button class="btn primary" onclick="callPing()">Call ping</button>
          <button class="btn" onclick="callMe()">Call admin_me</button>
        </div>
        <div style="margin-top:10px" class="status" id="apiBox">—</div>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://xdcscknfomlzwysczegc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkY3Nja25mb21send5c2N6ZWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MTYzMDMsImV4cCI6MjA4MzI5MjMwM30.E6o2wFFMOpK1DghLUqnxG6Ig09djy4bmDQexprhAiB4";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ADMIN_API_URL = SUPABASE_URL + "/functions/v1/admin-api";

  let SESSION = null;

  function setAuth(html){ document.getElementById("authBox").innerHTML = html; }
  function setApi(html){ document.getElementById("apiBox").innerHTML = html; }

  function safe(obj){
    try{ return JSON.stringify(obj, null, 2); }catch(e){ return String(obj); }
  }

  // ===== Supabase Auth + Email Verification Guard (ONE BLOCK) =====
  (async function authGuard(){
    await check(); // initial check
  })();
  // ===== End Guard =====

  async function check(){
    try{
      setAuth("Checking session…");
      const { data, error } = await supabaseClient.auth.getSession();
      if(error) throw error;

      if(!data.session){
        SESSION = null;
        setAuth('<span class="warn">No session.</span> Please sign in.');
        return;
      }

      const user = data.session.user;
      const verified = !!user.email_confirmed_at;
      if(!verified){
        SESSION = data.session;
        setAuth('<span class="err">Email not verified.</span> Verify your email, then refresh.');
        return;
      }

      SESSION = data.session;
      setAuth(
        '<span class="ok">Session OK ✅</span>\n' +
        'Email: ' + (user.email || "-") + '\n' +
        'Verified: ' + verified + '\n' +
        'Access token present: ' + (!!SESSION.access_token)
      );
    }catch(e){
      SESSION = null;
      setAuth('<span class="err">Error:</span> ' + (e.message || e));
    }
  }

  async function login(){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("pass").value;
    if(!email || !password){
      setAuth('<span class="warn">Missing</span>: email + password');
      return;
    }

    setAuth("Signing in…");
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      setAuth('<span class="err">Login failed:</span> ' + error.message);
      return;
    }
    SESSION = data.session;
    await check();
  }

  async function logout(){
    await supabaseClient.auth.signOut();
    SESSION = null;
    setApi("—");
    await check();
  }

  async function callAdmin(action, payload={}){
    if(!SESSION?.access_token) throw new Error("No session token. Sign in first.");

    const res = await fetch(ADMIN_API_URL, {
      method: "POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + SESSION.access_token
      },
      body: JSON.stringify({ action, payload })
    });

    const text = await res.text();
    let json;
    try{ json = JSON.parse(text); }catch(e){ throw new Error("Bad JSON from API: " + text); }

    if(!res.ok || json?.error){
      throw new Error(json?.error || ("HTTP " + res.status));
    }
    return json.data;
  }

  async function callPing(){
    try{
      setApi("Calling ping…");
      const data = await callAdmin("ping", {});
      setApi('<span class="ok">ping ✅</span>\n' + safe(data));
    }catch(e){
      setApi('<span class="err">ping ❌</span>\n' + (e.message || e));
    }
  }

  async function callMe(){
    try{
      setApi("Calling admin_me…");
      const data = await callAdmin("admin_me", {});
      setApi('<span class="ok">admin_me ✅</span>\n' + safe(data));
    }catch(e){
      setApi('<span class="err">admin_me ❌</span>\n' + (e.message || e));
    }
  }
</script>
</body>
</html>

<!-- FULL UPGRADED VERSION – NO CUTS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Withdraw - Coinluxora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050a18;
  --stroke:rgba(255,255,255,.12);
  --text:#eaf0ff;
  --muted:rgba(234,240,255,.65);
  --ok:#34d399;
  --err:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:
    radial-gradient(900px 420px at 10% 0%, rgba(83,113,255,.20), transparent 55%),
    radial-gradient(900px 420px at 90% 0%, rgba(52,211,153,.16), transparent 55%),
    var(--bg);
  color:var(--text);
  padding:16px;
}
.container{max-width:980px;margin:0 auto}

/* ===================== */
/* PREMIUM SIDEBAR STYLE */
/* ===================== */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  z-index:999;
}
.overlay.show{display:block;}

.sidebar{
  position:fixed; top:0; left:-310px;
  width:290px; height:100vh;
  background:linear-gradient(180deg,#040816,#020617);
  border-right:1px solid rgba(255,255,255,.12);
  padding:16px;
  transition:.3s ease;
  z-index:1000;
}
.sidebar.open{left:0;}

.sideBrand{
  font-weight:1000;
  font-size:18px;
  margin-bottom:14px;
}
.userTag{
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  margin-bottom:14px;
}
.userTag small{opacity:.6}
.sideItem{
  display:flex;gap:10px;align-items:center;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.25);
  margin-bottom:10px;
  text-decoration:none;
  color:var(--text);
  font-weight:1000;
}
.sideItem:hover{background:rgba(255,255,255,.08)}
.activeLink{
  border-color:#6366f1;
  background:rgba(99,102,241,.15);
}
.sideLogout{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-weight:1000;
  background:linear-gradient(90deg,#f43f5e,#ef4444);
  color:white;
  cursor:pointer;
}

/* ===================== */
/* FORM + CARDS */
/* ===================== */
.card{
  margin-bottom:14px;
  padding:18px;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 26px 90px rgba(0,0,0,.55);
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.full{grid-column:1/-1;}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);
  color:white;
}

button{
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:1000;
  cursor:pointer;
  background:linear-gradient(90deg,#6366f1,#22c55e);
  color:white;
}

.msg{margin-top:10px;font-weight:900}
.ok{color:#4ade80}
.err{color:#fb7185}
</style>
</head>

<body>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
  <div class="sideBrand">COINLUXORA</div>

  <div class="userTag">
    <small>Logged in as</small>
    <div id="sideName" style="font-weight:1000;margin-top:6px;">---</div>
  </div>

  <a class="sideItem" href="user-dashboard.html">🏠 Dashboard</a>
  <a class="sideItem" href="portfolio.html">📊 Portfolio</a>
  <a class="sideItem" href="plans.html">💼 Investment Plans</a>
  <a class="sideItem" href="support.html">🧑‍💻 Support</a>
  <a class="sideItem" href="deposits.html">💳 Deposit</a>
  <a class="sideItem activeLink" href="withdraw.html">➡ Withdraw</a>

  <button class="sideLogout" onclick="logout()">Logout</button>
</div>

<div class="container">

<h2>Withdraw Funds</h2>

<div class="card">
  <div class="grid">

    <div>
      <label>Withdrawal Method</label>
      <select id="method" onchange="toggleMethod()">
        <option value="crypto">Crypto</option>
        <option value="bank">Bank Transfer</option>
      </select>
    </div>

    <div>
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter amount"/>
    </div>

    <!-- CRYPTO -->
    <div id="cryptoFields" class="full">
      <label>Wallet Address</label>
      <input type="text" id="wallet"/>
    </div>

    <!-- BANK -->
    <div id="bankFields" class="full" style="display:none;">
      <label>Bank Name</label>
      <input type="text" id="bank_name"/>

      <label>Account Name</label>
      <input type="text" id="account_name"/>

      <label>Account Number</label>
      <input type="text" id="account_number"/>

      <label>Country</label>
      <input type="text" id="country"/>

      <label>SWIFT (Optional)</label>
      <input type="text" id="swift"/>
    </div>

    <div class="full">
      <button onclick="submitWithdrawal()">Submit Withdrawal</button>
      <div id="msg" class="msg"></div>
    </div>

  </div>
</div>

</div>

<script>
const SUPABASE_URL="https://xdcscknfomlzwysczegc.supabase.co";
const SUPABASE_ANON_KEY="YOUR_ANON_KEY";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentUser=null;

function openMenu(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}
function closeMenu(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

function toggleMethod(){
  const method=document.getElementById("method").value;
  document.getElementById("cryptoFields").style.display= method==="crypto"?"block":"none";
  document.getElementById("bankFields").style.display= method==="bank"?"block":"none";
}

function showMsg(text, ok=false){
  const m=document.getElementById("msg");
  m.textContent=text;
  m.className="msg "+(ok?"ok":"err");
}

async function submitWithdrawal(){
  const method=document.getElementById("method").value;
  const amount=Number(document.getElementById("amount").value);

  if(!amount||amount<=0){
    showMsg("Enter valid amount");
    return;
  }

  let payload={amount,method};

  if(method==="crypto"){
    const wallet=document.getElementById("wallet").value.trim();
    if(!wallet){showMsg("Wallet required");return;}
    payload.wallet_address=wallet;
  }

  if(method==="bank"){
    payload.bank_name=document.getElementById("bank_name").value.trim();
    payload.account_name=document.getElementById("account_name").value.trim();
    payload.account_number=document.getElementById("account_number").value.trim();
    payload.country=document.getElementById("country").value.trim();
    payload.swift=document.getElementById("swift").value.trim();

    if(!payload.bank_name||!payload.account_name||!payload.account_number||!payload.country){
      showMsg("Fill all required bank fields");
      return;
    }
  }

  const {error}=await supabaseClient.from("withdrawals").insert([{
    user_email:currentUser.email,
    ...payload,
    status:"pending"
  }]);

  if(error){
    showMsg(error.message);
    return;
  }

  showMsg("Withdrawal submitted successfully ✅",true);
}

async function init(){
  const {data}=await supabaseClient.auth.getUser();
  if(!data.user){window.location.href="login.html";return;}
  currentUser=data.user;
  document.getElementById("sideName").textContent=currentUser.email;
}

async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href="login.html";
}

init();
</script>

</body>
</html>

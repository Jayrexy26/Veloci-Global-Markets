<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VGM Admin API | Debug</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{--bg:#050a18;--text:#eaf0ff;--muted:rgba(234,240,255,.65);--stroke:rgba(255,255,255,0.12);--ok:#22c55e;--err:#f87171;--warn:#fbbf24}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:18px}
    .wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
    .card{border:1px solid var(--stroke);background:rgba(255,255,255,0.05);border-radius:18px;padding:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    label{font-size:12px;color:var(--muted);font-weight:900}
    input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,0.03);color:var(--text);outline:none}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,0.05);color:var(--text);padding:11px 12px;border-radius:14px;font-weight:950;cursor:pointer}
    .btn.primary{background:linear-gradient(135deg, rgba(91,108,255,.22), rgba(124,77,255,.14))}
    .btn.danger{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.10)}
    .status{border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:13px;line-height:1.45;white-space:pre-wrap;overflow:auto;max-height:520px}
    .ok{color:var(--ok);font-weight:950}
    .err{color:var(--err);font-weight:950}
    .warn{color:var(--warn);font-weight:950}
    code{color:#c7d2fe}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-weight:950;font-size:18px">Admin API Debug</div>
      <div style="color:var(--muted);margin-top:6px;font-size:13px">
        If you get <b>Invalid JWT</b>, it means your browser token is from a different project or stale.
      </div>
      <div style="color:var(--muted);margin-top:6px;font-size:13px">
        Function URL: <code id="fnUrl"></code>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div style="font-weight:950;margin-bottom:8px">Auth</div>
        <div style="display:grid;gap:8px">
          <label>Email</label>
          <input id="email" type="email" placeholder="admin@email.com" autocomplete="email">
          <label>Password</label>
          <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="btnRow">
          <button class="btn primary" id="btnLogin">Sign in</button>
          <button class="btn" id="btnCheck">Check Session</button>
          <button class="btn danger" id="btnLogout">Logout</button>
          <button class="btn danger" id="btnReset">Reset Auth (hard clear)</button>
        </div>
        <div style="margin-top:10px" class="status" id="authBox">Booting…</div>
      </div>

      <div class="card">
        <div style="font-weight:950;margin-bottom:8px">Calls</div>
        <div class="btnRow">
          <button class="btn primary" id="btnFetchPing">Ping (direct fetch)</button>
          <button class="btn" id="btnFetchMe">Admin Me (direct fetch)</button>
        </div>
        <div style="margin-top:10px" class="status" id="apiBox">—</div>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://xdcscknfomlzwysczegc.supabase.co";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE"; // <- MUST be the anon key for THIS project
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-api";
  document.getElementById("fnUrl").textContent = FUNCTION_URL;

  const authBox = document.getElementById("authBox");
  const apiBox = document.getElementById("apiBox");

  function setAuth(t){ authBox.textContent = t; }
  function setApi(t){ apiBox.textContent = t; }
  function pretty(o){ try{return JSON.stringify(o,null,2)}catch(e){return String(o)} }

  window.addEventListener("error", (e) => {
    authBox.innerHTML = `<span class="err">JS Error:</span>\n${e.message}\n${e.filename || ""}:${e.lineno || ""}`;
  });

  if(typeof supabase === "undefined"){
    authBox.innerHTML = `<span class="err">Supabase library failed to load.</span>\nCDN blocked or offline.`;
    throw new Error("supabase is undefined");
  }

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function check(){
    try{
      setAuth("Checking session…");
      const { data, error } = await supabaseClient.auth.getSession();
      if(error) throw error;

      if(!data.session){
        setAuth("No session. Please sign in.");
        return null;
      }

      const user = data.session.user;
      const verified = !!user.email_confirmed_at;

      setAuth(
        "Session OK ✅\n" +
        "Email: " + (user.email || "-") + "\n" +
        "Verified: " + verified + "\n" +
        "Token present: " + (!!data.session.access_token) + "\n\n" +
        "Access token (first 40 chars):\n" + String(data.session.access_token || "").slice(0,40) + "…"
      );

      return data.session;
    }catch(e){
      authBox.innerHTML = `<span class="err">Auth Error:</span>\n${e.message || e}`;
      return null;
    }
  }

  async function login(){
    try{
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("pass").value;
      if(!email || !password){
        authBox.innerHTML = `<span class="warn">Missing:</span> email + password`;
        return;
      }
      setAuth("Signing in…");
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      await check();
    }catch(e){
      authBox.innerHTML = `<span class="err">Login failed:</span>\n${e.message || e}`;
    }
  }

  async function logout(){
    try{
      await supabaseClient.auth.signOut();
      setApi("—");
      await check();
    }catch(e){
      authBox.innerHTML = `<span class="err">Logout error:</span>\n${e.message || e}`;
    }
  }

  async function hardReset(){
    try{
      setAuth("Hard clearing auth storage…");
      await supabaseClient.auth.signOut();

      // Remove any supabase tokens stored under your domain
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k) keys.push(k);
      }
      keys.forEach(k=>{
        if(k.includes("supabase") || k.includes("sb-") || k.includes("auth-token")){
          localStorage.removeItem(k);
        }
      });

      const skeys = [];
      for(let i=0;i<sessionStorage.length;i++){
        const k = sessionStorage.key(i);
        if(k) skeys.push(k);
      }
      skeys.forEach(k=>{
        if(k.includes("supabase") || k.includes("sb-") || k.includes("auth-token")){
          sessionStorage.removeItem(k);
        }
      });

      setApi("—");
      setAuth("Cleared. Refreshing page…");
      setTimeout(()=>location.reload(), 600);
    }catch(e){
      authBox.innerHTML = `<span class="err">Reset error:</span>\n${e.message || e}`;
    }
  }

  async function directCall(action){
    try{
      setApi("Calling " + action + "…");
      const { data } = await supabaseClient.auth.getSession();
      const token = data?.session?.access_token;
      if(!token) throw new Error("No session token — sign in first.");

      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type":"application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":"Bearer " + token
        },
        body: JSON.stringify({ action, payload: {} })
      });

      const text = await res.text();
      setApi("HTTP " + res.status + "\n\n" + text);
    }catch(e){
      apiBox.innerHTML = `<span class="err">${action} ❌</span>\n${e.message || e}`;
    }
  }

  document.getElementById("btnLogin").addEventListener("click", login);
  document.getElementById("btnCheck").addEventListener("click", check);
  document.getElementById("btnLogout").addEventListener("click", logout);
  document.getElementById("btnReset").addEventListener("click", hardReset);
  document.getElementById("btnFetchPing").addEventListener("click", ()=>directCall("ping"));
  document.getElementById("btnFetchMe").addEventListener("click", ()=>directCall("admin_me"));

  check();
</script>
</body>
</html>

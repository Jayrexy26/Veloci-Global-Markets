<style>
:root{
  --bg:#080c18; --s1:#0d1117; --s2:#111827; --s3:#1a2236; --s4:#222d42;
  --b:rgba(255,255,255,.07); --b2:rgba(255,255,255,.13);
  --accent:#f05a1a; --accent-dk:#d94d12;
  --green:#0ecb81; --red:#f6465d; --gold:#f0b90b; --blue:#2196f3;
  --text:#eaecef; --sub:#848e9c;
  --sidebar:220px; --header:60px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;border:none;outline:none;background:none;color:var(--text);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

.page{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* HEADER */
.hdr{height:var(--header);flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 20px 0 0;z-index:50;}
.hdr-logo-wrap{width:var(--sidebar);flex-shrink:0;height:100%;display:flex;align-items:center;padding:0 16px;border-right:1px solid var(--b);}
.hdr-logo-wrap img{height:34px;width:auto;}
.hdr-spacer{flex:1;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.hicon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;transition:all .15s;position:relative;}
.hicon:hover{background:var(--s3);color:var(--text);}
.hicon-badge{position:absolute;top:3px;right:2px;background:var(--red);color:#fff;font-size:8px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--s1);}
.hdr-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c94400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--s1);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .25s ease;}
.sidebar::-webkit-scrollbar{width:0;}
.sb-nav{flex:1;padding:8px 0;}
.nav-group-label{font-size:10px;font-weight:600;letter-spacing:.8px;color:rgba(132,142,156,.5);text-transform:uppercase;padding:14px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .15s;white-space:nowrap;border-left:2.5px solid transparent;text-decoration:none;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);}
.nav-item.active{color:var(--accent);background:rgba(240,90,26,.07);border-left-color:var(--accent);}
.nav-item svg{flex-shrink:0;width:16px;height:16px;}
.nav-item-label{flex:1;}
.nav-item-badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(240,90,26,.18);color:var(--accent);flex-shrink:0;}
.nav-divider{height:1px;background:var(--b);margin:6px 0;}
.sb-bottom{flex-shrink:0;border-top:1px solid var(--b);}
.sb-user{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.sb-user:hover{background:rgba(255,255,255,.03);}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c94400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sb-user-info{flex:1;min-width:0;}
.sb-user-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user-email{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 32px 48px;}
.main::-webkit-scrollbar{width:4px;}

/* PAGE HEADER */
.page-hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.page-title-wrap{display:flex;align-items:center;gap:12px;}
.page-title{font-size:22px;font-weight:800;color:var(--text);}
.unread-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;line-height:1.4;}
.mark-all-btn{padding:8px 18px;border:1.5px solid var(--b2);border-radius:8px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;background:none;}
.mark-all-btn:hover{border-color:var(--accent);color:var(--accent);}

/* FILTER TABS */
.filter-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:4px;width:fit-content;}
.filter-tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;border:none;background:none;}
.filter-tab.active{background:var(--accent);color:#fff;}
.filter-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05);}

/* NOTIFICATION LIST */
.notif-list{display:flex;flex-direction:column;gap:2px;}
.notif-item{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--s1);border:1px solid var(--b);border-radius:12px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.notif-item:hover{border-color:var(--b2);background:var(--s2);}
.notif-item.unread{background:rgba(240,90,26,.04);border-left:3px solid var(--accent);}
.notif-item.unread::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(240,90,26,.04),transparent 40%);pointer-events:none;}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.notif-icon.type-announcement{background:rgba(240,90,26,.15);color:var(--accent);}
.notif-icon.type-account,.notif-icon.type-kyc{background:rgba(33,150,243,.15);color:var(--blue);}
.notif-icon.type-success,.notif-icon.type-deposit{background:rgba(14,203,129,.15);color:var(--green);}
.notif-icon.type-warning,.notif-icon.type-withdrawal{background:rgba(240,185,11,.15);color:var(--gold);}
.notif-icon.type-urgent,.notif-icon.type-security{background:rgba(246,70,93,.15);color:var(--red);}
.notif-icon.type-system{background:rgba(132,142,156,.15);color:var(--sub);}
.notif-icon.type-trade{background:rgba(123,97,255,.15);color:#7b61ff;}
.notif-icon.type-promotion{background:rgba(240,185,11,.15);color:var(--gold);}
.notif-body{flex:1;min-width:0;}
.notif-title{font-size:13.5px;font-weight:500;color:var(--sub);margin-bottom:4px;line-height:1.4;}
.notif-item.unread .notif-title{font-weight:700;color:var(--text);}
.notif-msg{font-size:12.5px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.notif-msg.expanded{display:block;-webkit-line-clamp:unset;}
.notif-time{font-size:11px;color:var(--sub);margin-top:6px;flex-shrink:0;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px;}
.notif-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}

/* LOAD MORE */
.load-more-btn{width:100%;margin-top:12px;padding:13px;background:var(--s1);border:1px solid var(--b);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s;text-align:center;}
.load-more-btn:hover{border-color:var(--accent);color:var(--accent);}
.load-more-btn:disabled{opacity:.5;cursor:not-allowed;}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;}
.empty-icon{width:64px;height:64px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:28px;}
.empty-title{font-size:16px;font-weight:700;color:var(--text);}
.empty-sub{font-size:13px;color:var(--sub);}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
.skel-item{display:flex;gap:14px;padding:16px;background:var(--s1);border:1px solid var(--b);border-radius:12px;}
.skel-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;}
.skel-body{flex:1;display:flex;flex-direction:column;gap:8px;}
.skel-line{height:12px;border-radius:4px;}

/* LIGHT THEME */
body.light{--bg:#f0f2f5;--s1:#fff;--s2:#f7f8fa;--s3:#eef0f3;--b:rgba(0,0,0,.08);--b2:rgba(0,0,0,.14);--text:#111827;--sub:#6b7280;}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);}
</style>

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:'+(type==='success'?'#0ecb81':'#f6465d')+';color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

function fmtRelTime(ts){
  if(!ts) return 'â€”';
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000) return 'just now';
  if(d<3600000) return Math.floor(d/60000)+' min ago';
  if(d<86400000) return Math.floor(d/3600000)+'h ago';
  if(d<172800000) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function getTypeIcon(type){
  const icons = {
    announcement: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,

    success: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>`,
    deposit: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v14M5 9l7 7 7-7"/><path d="M3 21h18"/></svg>`,
    warning: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    withdrawal: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M5 15l7-7 7 7"/><path d="M3 3h18"/></svg>`,
    urgent: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    security: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    system: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg>`,
    trade: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
    promotion: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
  };
  return icons[type] || icons['system'];
}

function buildNotifHTML(n){
  const typeClass = 'type-'+(n.type||'system');
  const unreadClass = !n.read ? ' unread' : '';
  return `
  <div class="notif-item${unreadClass}" id="notif-${n.id}" onclick="handleNotifClick('${n.id}')">
    <div class="notif-icon ${typeClass}">${getTypeIcon(n.type)}</div>
    <div class="notif-body">
      <div class="notif-title">${escHtml(n.title||'Notification')}</div>
      <div class="notif-msg" id="msg-${n.id}">${escHtml(n.message||'')}</div>
      <div class="notif-time">${fmtRelTime(n.created_at)}</div>
    </div>
    <div class="notif-meta">
      ${!n.read ? '<div class="notif-dot"></div>' : ''}
    </div>
  </div>`;
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderList(notifs){
  const list = document.getElementById('notif-list');
  // remove skeletons
  ['skel-1','skel-2','skel-3'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});

  if(notifs.length === 0 && offset === 0){
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128276;</div><div class="empty-title">No notifications yet</div><div class="empty-sub">You're all caught up! Notifications will appear here.</div></div>`;
    return;
  }
  if(offset === 0) list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', notifs.map(buildNotifHTML).join(''));
}

function updateUnreadBadge(){
  const count = allNotifs.filter(n=>!n.read).length;
  const badge = document.getElementById('unread-badge');
  const hdrBadge = document.getElementById('hdr-notif-badge');
  if(count > 0){
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = '';
    hdrBadge.textContent = count > 99 ? '99+' : count;
    hdrBadge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
    hdrBadge.style.display = 'none';
  }
}

function filterNotifs(notifs){
  if(currentFilter === 'all') return notifs;
  return notifs.filter(n => (n.type||'').toLowerCase().includes(currentFilter) ||
    (currentFilter === 'announcement' && n.type === 'announcement') ||
    (currentFilter === 'trade' && (n.type === 'trade' || n.type === 'success')) ||
    (currentFilter === 'system' && (n.type === 'system' || n.type === 'account' || n.type === 'kyc' || n.type === 'security')) ||
    (currentFilter === 'promotion' && n.type === 'promotion')
  );
}

async function loadNotifs(){
  const {data, error} = await db.from('notifications')
    .select('*')
    .eq('user_id', uid)
    .order('created_at', {ascending: false})
    .range(offset, offset + PAGE_SIZE - 1);

  if(error){ console.error(error); return; }
  const fetched = data || [];
  allNotifs = offset === 0 ? fetched : [...allNotifs, ...fetched];
  hasMore = fetched.length === PAGE_SIZE;

  const filtered = filterNotifs(allNotifs);
  renderList(offset === 0 ? filtered : filtered.slice(offset));
  updateUnreadBadge();

  const btn = document.getElementById('load-more-btn');
  btn.style.display = hasMore ? 'block' : 'none';
}

async function loadMore(){
  offset += PAGE_SIZE;
  const btn = document.getElementById('load-more-btn');
  btn.disabled = true; btn.textContent = 'Loading...';
  await loadNotifs();
  btn.disabled = false; btn.textContent = 'Load More';
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  offset = 0;
  const list = document.getElementById('notif-list');
  list.innerHTML = '';
  const filtered = filterNotifs(allNotifs);
  renderList(filtered);
  const btn = document.getElementById('load-more-btn');
  btn.style.display = hasMore ? 'block' : 'none';
}

async function handleNotifClick(id){
  const n = allNotifs.find(n=>n.id===id);
  if(!n) return;

  // Expand/collapse message
  const msgEl = document.getElementById('msg-'+id);
  if(msgEl) msgEl.classList.toggle('expanded');

  // Mark as read
  if(!n.read){
    n.read = true;
    const el = document.getElementById('notif-'+id);
    if(el){
      el.classList.remove('unread');
      const dot = el.querySelector('.notif-dot');
      if(dot) dot.remove();
      el.querySelector('.notif-title').style.fontWeight = '500';
      el.querySelector('.notif-title').style.color = 'var(--sub)';
    }
    await db.from('notifications').update({read:true}).eq('id',id);
    updateUnreadBadge();
  }
}

async function markAllRead(){
  const {error} = await db.from('notifications').update({read:true}).eq('user_id',uid).eq('read',false);
  if(error){ showToast('Failed to mark all read','error'); return; }
  allNotifs.forEach(n=>n.read=true);
  document.querySelectorAll('.notif-item.unread').forEach(el=>{
    el.classList.remove('unread');
    const dot = el.querySelector('.notif-dot');
    if(dot) dot.remove();
    const title = el.querySelector('.notif-title');
    if(title){ title.style.fontWeight='500'; title.style.color='var(--sub)'; }
  });
  updateUnreadBadge();
  showToast('All notifications marked as read.');
}

function prependNotif(n){
  allNotifs.unshift(n);
  const list = document.getElementById('notif-list');
  const emptyState = list.querySelector('.empty-state');
  if(emptyState) emptyState.remove();
  list.insertAdjacentHTML('afterbegin', buildNotifHTML(n));
  updateUnreadBadge();
}

async function init(){
  const {data:{session}} = await db.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  uid = session.user.id;

  const {data:p} = await db.from('profiles').select('first_name,last_name').eq('id',uid).single();
  if(p){
    const initials = ((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'') || '?';
    document.getElementById('hdr-avatar').textContent = initials;
    document.getElementById('sb-avatar').textContent = initials;
    document.getElementById('sb-name').textContent = [p.first_name,p.last_name].filter(Boolean).join(' ') || 'User';
  }
  document.getElementById('sb-email').textContent = session.user.email || '';

  await loadNotifs();

  // Real-time subscription
  db.channel('notifs-'+uid)
    .on('postgres_changes',{
      event:'INSERT', schema:'public', table:'notifications',
      filter:'user_id=eq.'+uid
    }, payload => {
      prependNotif(payload.new);
    })
    .subscribe();

  // Apply saved theme
  if(localStorage.getItem('vgm-theme')==='light') document.body.classList.add('light');
}

async function signOut(){
  await db.auth.signOut();
  window.location.href='login.html';
}

init();
</script>

<!DOCTYPE html><html><head><meta charset="UTF-8"><script>
var p=new URLSearchParams(window.location.search);
if(p.has('code')||p.has('access_token')||window.location.hash.includes('access_token')){
  window.location.replace('session-new.html'+window.location.search+window.location.hash);
}else{
  window.location.replace('index-new.html');
}
</script></head><body></body></html>

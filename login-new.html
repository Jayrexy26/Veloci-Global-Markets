<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="assets/vgm-logo.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — Veloci Global Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{font-family:'Inter',sans-serif;background:#080c18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
a{text-decoration:none;color:inherit;}
img{display:block;max-width:100%;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ── Loading overlay ── */
#vgm-loading{
  position:fixed;inset:0;
  background:#080c18;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:999;
  gap:0;
}
.al-glow{
  position:absolute;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,90,26,.10) 0%,transparent 70%);
  pointer-events:none;
  animation:alPulse 3s ease-in-out infinite;
}
@keyframes alPulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.12);opacity:1;}}
.al-logo{height:64px;width:auto;position:relative;z-index:1;animation:alFade .55s cubic-bezier(.4,0,.2,1) both;}
.al-brand{font-size:14px;font-weight:600;color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-top:12px;margin-bottom:40px;position:relative;z-index:1;animation:alFade .55s .08s cubic-bezier(.4,0,.2,1) both;}
.al-bar-track{width:200px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;position:relative;z-index:1;animation:alFade .4s .16s cubic-bezier(.4,0,.2,1) both;}
.al-bar{height:100%;width:40%;background:linear-gradient(90deg,transparent 0%,#f05a1a 50%,transparent 100%);border-radius:2px;animation:alSweep 1.5s ease-in-out infinite;}
@keyframes alSweep{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
@keyframes alFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── Wrapper ── */
#vgm-login-page{display:none;width:100%;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 20px;}

/* ── Logo area ── */
.page-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.page-logo img{height:44px;width:auto;object-fit:contain;}
.page-logo__text{font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.3px;white-space:nowrap;}

/* ── Card ── */
.card{
  width:100%;max-width:460px;
  background:#111827;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:36px 32px;
}

.card-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;}
.card-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:28px;}

/* ── Field ── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;}
.field-wrap{position:relative;}
.field input{
  width:100%;height:44px;
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:8px;padding:0 14px;
  font-size:14px;color:#fff;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus{border-color:#f05a1a;box-shadow:0 0 0 3px rgba(240,90,26,.12);}
.field input::placeholder{color:rgba(255,255,255,0.25);}
.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);
  padding:0;display:flex;align-items:center;transition:color .15s;
}
.eye-btn:hover{color:rgba(255,255,255,.7);}

/* ── Forgot link row ── */
.forgot-row{display:flex;justify-content:flex-end;margin-top:-8px;margin-bottom:16px;}
.forgot-link{font-size:12px;color:rgba(255,255,255,.35);cursor:pointer;transition:color .15s;}
.forgot-link:hover{color:#f05a1a;}

/* ── Submit button ── */
.btn-submit{
  width:100%;height:46px;
  background:#f05a1a;border:none;border-radius:8px;
  font-size:14px;font-weight:700;color:#fff;
  cursor:pointer;letter-spacing:0.3px;
  transition:background .15s;margin-top:4px;
}
.btn-submit:hover{background:#d94d12;}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;}

/* ── Error / success boxes ── */
.error-box{
  display:none;
  background:rgba(239,68,68,0.12);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;color:#f87171;
  margin-bottom:14px;
}
.success-box{
  display:none;
  background:rgba(14,203,129,0.10);
  border:1px solid rgba(14,203,129,0.25);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;color:#0ecb81;
  margin-bottom:14px;
}

/* ── Bottom links ── */
.form-links{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px;}
.form-link{font-size:13px;color:rgba(255,255,255,.35);}
.form-link a{color:#f05a1a;font-weight:600;}
.form-link a:hover{text-decoration:underline;}

/* ── Footer ── */
.page-footer{margin-top:24px;font-size:12px;color:rgba(255,255,255,.18);text-align:center;}

/* ── Login success modal ── */
#loginSuccessModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(8,12,24,.88);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;}
.ls-card{background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:44px 36px;max-width:360px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.7);animation:lsIn .45s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes lsIn{from{opacity:0;transform:scale(.82) translateY(28px);}to{opacity:1;transform:none;}}
.ls-ring{width:80px;height:80px;border-radius:50%;background:rgba(240,90,26,.1);border:2px solid rgba(240,90,26,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:lsRing .55s .15s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes lsRing{from{transform:scale(0);}to{transform:scale(1);}}
.ls-icon{width:34px;height:34px;stroke:#f05a1a;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.ls-title{font-size:20px;font-weight:800;color:#eaecef;margin-bottom:8px;}
.ls-sub{font-size:13px;color:rgba(234,236,239,.5);line-height:1.65;margin-bottom:20px;}
.ls-dots{display:flex;align-items:center;justify-content:center;gap:7px;}
.ls-dot{width:7px;height:7px;border-radius:50%;background:#f05a1a;animation:lsDot 1.2s ease-in-out infinite;}
.ls-dot:nth-child(2){animation-delay:.2s;}.ls-dot:nth-child(3){animation-delay:.4s;}
@keyframes lsDot{0%,80%,100%{transform:scale(.55);opacity:.35;}40%{transform:scale(1);opacity:1;}}

@media(max-width:500px){
  .card{padding:28px 20px;}
  .page-logo__text{font-size:17px;}
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="vgm-loading">
  <div class="al-glow"></div>
  <img class="al-logo" src="assets/vgm-logo.png" alt="Veloci Global Markets"/>
  <div class="al-brand">Veloci Global Markets</div>
  <div class="al-bar-track"><div class="al-bar"></div></div>
</div>

<!-- Login success modal -->
<div id="loginSuccessModal">
  <div class="ls-card">
    <div class="ls-ring">
      <svg class="ls-icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </div>
    <div class="ls-title">Login Successful!</div>
    <div class="ls-sub">Welcome back. Taking you to your account…</div>
    <div class="ls-dots">
      <div class="ls-dot"></div>
      <div class="ls-dot"></div>
      <div class="ls-dot"></div>
    </div>
  </div>
</div>

<!-- Main page -->
<div id="vgm-login-page">

  <div class="page-logo">
    <img src="assets/vgm-logo.png" alt="Veloci Global Markets"/>
    <span class="page-logo__text">Veloci Global Markets</span>
  </div>

  <div class="card">
    <div class="card-title">Client Portal Login</div>
    <div class="card-sub">Welcome back — sign in to your account</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="your@email.com" autocomplete="email"/>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <input type="password" id="l-pwd" placeholder="Enter your password" style="padding-right:44px;" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button class="eye-btn" onclick="togglePwd('l-pwd',this)" tabindex="-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="forgot-row">
      <span class="forgot-link" onclick="doForgot()">Forgot password?</span>
    </div>

    <div class="error-box" id="l-error"></div>
    <div class="success-box" id="l-success"></div>

    <button class="btn-submit" id="l-btn" onclick="doLogin()">Log In</button>

    <div class="form-links">
      <span class="form-link">Don't have an account? <a href="register-new.html">Register</a></span>
    </div>
  </div>

  <div class="page-footer">Veloci Global Markets &copy; 2025 &nbsp;&middot;&nbsp; Secure Connection</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script>
/* ── Auto-redirect if already logged in ── */
(async () => {
  const db = window.SV_DB;
  if (!db) return showPage();
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    sessionStorage.removeItem('sv_pin_ok');
    window.location.href = 'session-new.html';
    return;
  }
  showPage();
})();

/* ── Show banned message if redirected back ── */
(function() {
  const p = new URLSearchParams(window.location.search).get('banned');
  if (p === '1') {
    const el = document.getElementById('l-error');
    el.textContent = 'Account Deactivated. Please contact support via live chat or email for activation guidance.';
    el.style.display = 'block';
    history.replaceState(null, '', 'login-new.html');
  }
})();

function showPage() {
  const loadEl  = document.getElementById('vgm-loading');
  const pageEl  = document.getElementById('vgm-login-page');
  loadEl.style.opacity    = '0';
  loadEl.style.transition = 'opacity .4s ease';
  pageEl.style.display    = 'flex';
  setTimeout(() => { loadEl.style.display = 'none'; }, 420);
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.style.color = isText ? 'rgba(255,255,255,.3)' : '#f05a1a';
}

function showErr(msg) {
  const el = document.getElementById('l-error');
  el.textContent   = msg;
  el.style.display = 'block';
}

function hideMessages() {
  document.getElementById('l-error').style.display   = 'none';
  document.getElementById('l-success').style.display = 'none';
}

async function doLogin() {
  const btn   = document.getElementById('l-btn');
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;

  hideMessages();
  if (!email || !pwd) return showErr('Please enter your email and password.');

  btn.disabled    = true;
  btn.textContent = 'Signing in…';

  const db = window.SV_DB;
  const { data: loginData, error } = await db.auth.signInWithPassword({ email, password: pwd });

  if (error) {
    btn.disabled    = false;
    btn.textContent = 'Log In';
    return showErr(error.message === 'Invalid login credentials'
      ? 'Incorrect email or password.'
      : error.message);
  }

  /* Check banned status */
  const { data: prof } = await db.from('profiles').select('status').eq('id', loginData.user.id).single();
  if (prof?.status === 'banned') {
    await db.auth.signOut();
    btn.disabled    = false;
    btn.textContent = 'Log In';
    return showErr('Account Deactivated. Please contact support for activation guidance.');
  }

  sessionStorage.removeItem('sv_pin_ok');
  document.getElementById('loginSuccessModal').style.display = 'flex';
  setTimeout(() => { window.location.href = 'session-new.html'; }, 2000);
}

async function doForgot() {
  const email = document.getElementById('l-email').value.trim();
  hideMessages();
  if (!email) return showErr('Enter your email address above first.');

  const db = window.SV_DB;
  const { error } = await db.auth.resetPasswordForEmail(email);
  if (error) return showErr(error.message);

  const okEl = document.getElementById('l-success');
  okEl.textContent   = 'Password reset email sent — check your inbox.';
  okEl.style.display = 'block';
}
</script>
</body>
</html>

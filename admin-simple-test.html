<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin API Test | Credit & Debit</title>

  <style>
    body{margin:0;background:#050a18;color:#eaf0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
    .ui{position:relative;z-index:2147483647;pointer-events:auto;max-width:900px}
    .ui *{pointer-events:auto}
    h2{margin:0 0 14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
    input{
      padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);color:#eaf0ff;outline:none;min-width:240px
    }
    button{border:none;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer;background:#5b6cff;color:#050a18}
    .alt{background:#38bdf8}
    .danger{background:#f87171}
    pre{margin-top:14px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04);white-space:pre-wrap;word-break:break-word;min-height:140px}
    .small{opacity:.75;font-size:12px;margin-top:6px}
  </style>
</head>

<body>
  <div class="ui">
    <h2>Admin API Test (Credit / Debit)</h2>

    <div class="row">
      <button id="btnPing" type="button">Ping</button>
      <button id="btnUsers" type="button" class="alt">Users Count</button>
    </div>

    <div class="row">
      <input id="email" placeholder="User email (e.g. user@gmail.com)" />
      <input id="amount" type="number" step="0.01" placeholder="Amount (e.g. 50)" />
      <input id="note" placeholder="Admin note (optional)" />
    </div>

    <div class="row">
      <button id="btnCredit" type="button">Credit</button>
      <button id="btnDebit" type="button" class="danger">Debit</button>
    </div>

    <div class="small">Protected by <b>x-admin-secret</b>. Logs saved in <b>admin_actions_log</b>.</div>

    <pre id="out">Ready…</pre>
  </div>

<script>
  const FUNCTION_URL = "https://xdcscknfomlzwysczegc.supabase.co/functions/v1/admin-api";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkY3Nja25mb21send5c2N6ZWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MTYzMDMsImV4cCI6MjA4MzI5MjMwM30.E6o2wFFMOpK1DghLUqnxG6Ig09djy4bmDQexprhAiB4";
  const ADMIN_SECRET = "VGM_ADMIN_2026_qazxswedcvfrtgbnhyuj";

  const out = document.getElementById("out");

  function prettyText(status, text){
    return "HTTP " + status + "\n\n" + text;
  }

  async function call(action, payload={}){
    out.textContent = "Sending: " + action + " …";
    try{
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": ANON_KEY,
          "x-admin-secret": ADMIN_SECRET
        },
        body: JSON.stringify({ action, payload })
      });
      const text = await res.text();
      out.textContent = prettyText(res.status, text);
    }catch(err){
      out.textContent = "Fetch failed:\n" + (err.message || err);
    }
  }

  document.getElementById("btnPing").addEventListener("click", () => call("ping"));
  document.getElementById("btnUsers").addEventListener("click", () => call("users_count"));

  document.getElementById("btnCredit").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const amount = Number(document.getElementById("amount").value || 0);
    const note = document.getElementById("note").value.trim();
    call("user_credit", { email, amount, note });
  });

  document.getElementById("btnDebit").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const amount = Number(document.getElementById("amount").value || 0);
    const note = document.getElementById("note").value.trim();
    call("user_debit", { email, amount, note });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VGM Admin • Wallet Addresses</title>

  <style>
    :root{
      --bg:#050a18;
      --bg2:#020617;
      --text:#eaf0ff;
      --muted: rgba(234,240,255,.65);
      --muted2: rgba(234,240,255,.45);
      --stroke: rgba(255,255,255,.12);

      --ok:#22c55e;
      --err:#f87171;
      --warn:#f59e0b;

      --blue:#5b6cff;
      --purple:#7c4dff;

      --shadow: 0 26px 90px rgba(0,0,0,.55);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(91,108,255,.16), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(124,77,255,.14), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      min-height: 100vh;
      overflow-x:hidden;
    }

    .wrap{
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    .head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
    }
    h1{
      margin:0;
      font-size: 16px;
      font-weight: 900;
    }
    .sub{
      margin-top:6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .panel{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.035);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .bar{
      display:flex;
      gap:10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      align-items:center;
      flex-wrap: wrap;
    }

    .inp{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 230px;
      flex: 1 1 230px;
    }
    label{
      font-size: 11px;
      color: var(--muted2);
    }
    input{
      width:100%;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: var(--text);
      outline:none;
      font-size: 12px;
    }

    .btn{
      border: none;
      outline:none;
      cursor:pointer;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      font-weight: 900;
      font-size: 12px;
      background: linear-gradient(135deg, rgba(91,108,255,.95), rgba(124,77,255,.92));
      box-shadow: 0 18px 50px rgba(91,108,255,.18);
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
      user-select:none;
      white-space: nowrap;
    }
    .btn.secondary{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:none;
      font-weight: 900;
    }
    .btn:active{ transform: translateY(1px); }

    .table{
      width:100%;
      border-collapse: collapse;
    }
    th, td{
      text-align:left;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: 12px;
      vertical-align: top;
    }
    th{
      color: var(--muted);
      font-weight: 900;
      background: rgba(255,255,255,.02);
    }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      word-break: break-all;
      line-height: 1.35;
    }

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap: wrap;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 60;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 12px;
      box-shadow: 0 26px 90px rgba(0,0,0,.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Wallet Addresses (Global)</h1>
        <div class="sub">Update deposit addresses shown to all users. Admin-secured via x-admin-secret + x-admin-id.</div>
      </div>
    </div>

    <div class="panel">
      <div class="bar">
        <div class="inp">
          <label>Wallet API URL (Edge Function)</label>
          <input id="apiUrl" placeholder="https://YOUR-PROJECT.supabase.co/functions/v1/wallet-api"/>
        </div>
        <div class="inp">
          <label>Admin Secret (x-admin-secret)</label>
          <input id="adminSecret" placeholder="ADMIN_SECRET"/>
        </div>
        <div class="inp" style="min-width:180px; flex:0 0 180px;">
          <label>Admin ID (x-admin-id)</label>
          <input id="adminId" placeholder="admin"/>
        </div>

        <button class="btn" id="btnLoad" type="button">Load Wallets</button>
      </div>

      <div style="overflow:auto;">
        <table class="table">
          <thead>
            <tr>
              <th style="width:120px;">Asset Key</th>
              <th style="width:140px;">Name</th>
              <th style="width:190px;">Network</th>
              <th>Address</th>
              <th style="width:180px;">Memo/Tag</th>
              <th style="width:160px;">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    function toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(()=> el.classList.remove("show"), 1500);
    }

    async function callApi(action, payload){
      const apiUrl = (document.getElementById("apiUrl").value || "").trim();
      const adminSecret = (document.getElementById("adminSecret").value || "").trim();
      const adminId = (document.getElementById("adminId").value || "admin").trim();

      if(!apiUrl) throw new Error("Set Wallet API URL first.");
      if(!adminSecret) throw new Error("Set Admin Secret first.");

      const res = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-secret": adminSecret,
          "x-admin-id": adminId
        },
        body: JSON.stringify({ action, ...payload })
      });

      const data = await res.json().catch(()=> ({}));
      if(!res.ok || data?.success === false){
        throw new Error(data?.error || ("HTTP " + res.status));
      }
      return data;
    }

    function rowTemplate(w){
      const memo = [w.memo_label || "", w.memo_value || ""].filter(Boolean).join(": ");
      return `
        <tr data-key="${w.asset_key}">
          <td class="mono">${w.asset_key}</td>
          <td><input data-field="name" value="${(w.name || "").replaceAll('"','&quot;')}" /></td>
          <td><input data-field="network" value="${(w.network || "").replaceAll('"','&quot;')}" /></td>
          <td><input data-field="address" value="${(w.address || "").replaceAll('"','&quot;')}" /></td>
          <td>
            <input data-field="memo_label" placeholder="Memo label (optional)" value="${(w.memo_label || "").replaceAll('"','&quot;')}" style="margin-bottom:8px;"/>
            <input data-field="memo_value" placeholder="Memo value (optional)" value="${(w.memo_value || "").replaceAll('"','&quot;')}" />
          </td>
          <td>
            <div class="row-actions">
              <button class="btn" data-act="save" type="button">Save</button>
              <button class="btn secondary" data-act="copy" type="button">Copy Addr</button>
            </div>
          </td>
        </tr>
      `;
    }

    async function loadWallets(){
      const data = await callApi("wallets_admin_list", {});
      const list = data.wallets || [];
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = list.map(rowTemplate).join("");

      tbody.querySelectorAll("button[data-act='save']").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          const tr = e.target.closest("tr");
          const asset_key = tr.getAttribute("data-key");

          const wallet = { asset_key };
          tr.querySelectorAll("input[data-field]").forEach(inp=>{
            wallet[inp.getAttribute("data-field")] = (inp.value || "").trim();
          });

          // Normalize empty memo fields to null
          wallet.memo_label = wallet.memo_label ? wallet.memo_label : null;
          wallet.memo_value = wallet.memo_value ? wallet.memo_value : null;

          try{
            await callApi("wallets_admin_upsert", { wallet });
            toast(asset_key + " updated ✅");
          }catch(err){
            toast("Error: " + err.message);
          }
        });
      });

      tbody.querySelectorAll("button[data-act='copy']").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          const tr = e.target.closest("tr");
          const addr = tr.querySelector("input[data-field='address']").value || "";
          try{
            await navigator.clipboard.writeText(addr);
            toast("Copied ✅");
          }catch{
            toast("Copy failed");
          }
        });
      });

      toast("Loaded ✅");
    }

    document.getElementById("btnLoad").addEventListener("click", ()=>{
      loadWallets().catch(err => toast("Error: " + err.message));
    });
  </script>
</body>
</html>
